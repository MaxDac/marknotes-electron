name: Checks

# Reusable checks shared by PR CI, Main CI and Release.
# Script contract (package.json): deps:check, deps:audit, lint, format:check, typecheck, test:coverage, test:parity, e2e, build, dist.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies (deprecations, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      # These checks use only Node and npm, and cover all lockfile platforms.
      - run: npm run deps:check
      - run: npm run deps:audit

  lint:
    name: Lint (eslint, prettier, tsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      # Private feeds in the lockfile break Dependabot and fresh clones. The shared sync core (@marknotes/sync) is the
      # only exception: it is built from an immutable GitHub source commit.
      - name: Check lockfile uses registry.npmjs.org
        run: |
          bad=$(grep -oE '"resolved": *"[^"]*"' package-lock.json | grep -vE '"resolved": *"(https://registry\.npmjs\.org/|git\+https://github\.com/MaxDac/marknotes-sync\.git#[0-9a-f]{40}")' || true)
          if [ -n "$bad" ]; then
            echo "::error file=package-lock.json::package-lock.json has resolved URLs outside https://registry.npmjs.org/. Regenerate it with the project .npmrc."
            echo "$bad"
            exit 1
          fi
      - uses: ./.github/actions/setup-sync-core
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-sync-core
      - run: npm ci
      # Runs the unit tests with the coverage gate (thresholds in vitest.config.ts).
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  # Shared golden fixtures from marknotes-spec (spec/ submodule), also run by the Android and web apps.
  parity:
    name: Parity (marknotes-spec fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-sync-core
      - run: npm ci
      - run: npm run test:parity

  # The Linux entry keeps the original job name: it is a required status check in the main ruleset.
  e2e:
    name: ${{ matrix.os == 'ubuntu-24.04' && 'E2E (Playwright Electron)' || format('E2E (Playwright Electron, {0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-sync-core
      - run: npm ci
      - run: npm run build
      # Electron needs a display on Linux runners.
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e
      - if: runner.os != 'Linux'
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    name: Build (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-sync-core
      - run: npm ci
      - run: npm run dist -- --linux AppImage deb --publish never
      - name: Install package verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends desktop-file-utils xdotool x11-utils xvfb
      # deb metadata/contents, install + launch with the Chromium sandbox, extracted AppImage launch.
      - name: Verify and launch-smoke Linux installers
        run: xvfb-run -a bash scripts/linux-package-smoke.sh
      - name: Upload Linux installers
        uses: actions/upload-artifact@v7
        with:
          name: marknotes-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: macos-latest
            target: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-sync-core
      - run: npm ci
      - run: npm test -- test/dependency-compatibility.test.ts
      - name: Build installers (unsigned)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- ${{ matrix.target }} --publish never
      - name: Verify macOS update metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          grep -q -- '-arm64' release/latest-mac.yml
          grep -q -- '-x64' release/latest-mac.yml
