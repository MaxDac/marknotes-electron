name: Checks

# Reusable checks shared by PR CI, Main CI and Release.
# Script contract (package.json): deps:check, deps:audit, lint, format:check, typecheck, test, e2e, build, dist.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies (deprecations, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      # These checks use only Node and npm, and cover all lockfile platforms.
      - run: npm run deps:check
      - run: npm run deps:audit

  lint:
    name: Lint (eslint, prettier, tsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      # Private feeds in the lockfile break Dependabot and fresh clones.
      - name: Check lockfile uses registry.npmjs.org
        run: |
          bad=$(grep -oE '"resolved": *"[^"]*"' package-lock.json | grep -vE '"resolved": *"https://registry\.npmjs\.org/' || true)
          if [ -n "$bad" ]; then
            echo "::error file=package-lock.json::package-lock.json has resolved URLs outside https://registry.npmjs.org/. Regenerate it with the project .npmrc."
            echo "$bad"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (Playwright Electron)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # Electron needs a display on Linux runners.
      - run: xvfb-run --auto-servernum npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    name: Build (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run dist -- --linux AppImage deb --publish never
      - name: Upload Linux installers
        uses: actions/upload-artifact@v7
        with:
          name: marknotes-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: macos-latest
            target: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test -- test/dependency-compatibility.test.ts
      - name: Build installers (unsigned)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- ${{ matrix.target }} --publish never
      - name: Verify macOS update metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          grep -q -- '-arm64' release/latest-mac.yml
          grep -q -- '-x64' release/latest-mac.yml
