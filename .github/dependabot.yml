version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      electron:
        patterns: ["electron", "electron-*", "@electron/*"]
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
